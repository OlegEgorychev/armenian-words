:root{
  --bg:#FBF7F2;--card:#FFFFFF;--ink:#2B2622;--muted:#7A6F66;--line:#ECE3D9;
  --accent:#E8833A;--accent-ink:#fff;--accent-soft:#FCEBDD;
  --ok:#3B9F5A;--ok-soft:#E3F4E8;--bad:#D2504A;--bad-soft:#FBE5E3;
  --hy:"Noto Sans Armenian","Arian AMU","Sylfaen","Mshtakan",system-ui,sans-serif;
  --radius:16px;--sel:#FFF4B8;--sel-b:#D8C25C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1A1714;--card:#25211D;--ink:#F1EAE2;--muted:#A89C90;--line:#3A342E;
  --accent-soft:#3B2A1C;--ok-soft:#1E3326;--bad-soft:#3A2220;--sel:#4A4220;--sel-b:#8F7F35;
}}
:root[data-theme=dark]{--sel:#4A4220;--sel-b:#8F7F35;--bg:#1A1714;--card:#25211D;--ink:#F1EAE2;--muted:#A89C90;--line:#3A342E;--accent-soft:#3B2A1C;--ok-soft:#1E3326;--bad-soft:#3A2220}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hy{font-family:var(--hy)}
#app{max-width:580px;margin:0 auto;min-height:100vh;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.logo{font:700 26px var(--hy);letter-spacing:.5px}
.logo small{font:500 13px system-ui;color:var(--muted);margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:14px}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip em{font-style:normal;opacity:.7;margin-left:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;transition:transform .1s}
.tr-card:active{transform:scale(.98)}
.tr-card .ico{font-size:24px}
.tr-card b{font-size:16px}
.tr-card span{font-size:13px;color:var(--muted)}
.tr-card .cnt{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px}
.tr-card.wide{grid-column:span 2;background:linear-gradient(135deg,var(--accent),#D9622B);color:#fff;border:0}
.tr-card.wide span{color:#fff;opacity:.9}
.tr-card.wide .cnt{background:rgba(255,255,255,.25);color:#fff}
.tr-card.dim{opacity:.5}
.daily{width:100%;margin:0 0 14px;border:0;border-radius:var(--radius);padding:16px;text-align:left;color:#fff;background:linear-gradient(135deg,#2F7A5B,#3FA27A);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.daily:active{transform:scale(.99)}
.daily .d-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.daily b{font-size:19px}
.daily .d-sub{font-size:13px;opacity:.92}
.daily .d-mix{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.daily .d-mix span{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.daily.done{background:linear-gradient(135deg,#5E7F70,#7A9A8B)}
.daily.dim{opacity:.55}
.ver{display:block;text-align:center;font-size:12px;margin:14px 0 4px;color:var(--muted);text-decoration:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:190px;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--accent);font-weight:700}

/* session */
.s-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{border:0;background:none;font-size:24px;color:var(--muted);padding:4px 8px}
.s-top .bar{flex:1;height:14px}
.s-top .xp{font-weight:700;color:var(--accent);min-width:48px;text-align:right}
.q-label{color:var(--muted);font-size:14px;margin-bottom:8px;font-weight:600}

// Cyrillic transcription → Latin
function cyr2lat(s){
  const M={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',ы:'ə',э:'e',ю:'yu',я:'ya',ь:'',ё:'yo'};
  return s.replace(/гх/g,'gh').replace(/дж/g,'j').replace(/[а-яё]/g,c=>M[c]??c);
}

const BASE=[],THEMES=[];
(function parse(){
  let th=null;
  RAW.trim().split('\n').forEach(line=>{
    line=line.trim();if(!line)return;
    if(line.startsWith('#')){const [ru,en]=line.slice(1).split('|').map(x=>x.trim());th=THEMES.find(x=>x.id===ru)||{id:ru,ru,en};if(!THEMES.includes(th))THEMES.push(th);return;}
    const [hy,ru,en,trRu]=line.split('|').map(x=>x.trim());
    BASE.push({id:hy,hy,ru,en,trRu,trEn:cyr2lat(trRu),th:th.id});
  });
})();
const themeName=id=>{if(id===MY)return t('myWords');const x=THEMES.find(z=>z.id===id);return x?x[S.lang]||x.ru:id;};
function translit(hy,lang){
  let out='';const s=hy.toLowerCase();const map=Object.fromEntries(ABC.map(a=>[a[0],baseSnd(lang==='en'?a[3]:a[2])]));
  for(let i=0;i<s.length;i++){
    const c=s[i],start=i===0||s[i-1]===' ';
    if(c==='ո'&&s[i+1]==='ւ'){out+=map['ու'];i++;continue;}
    if(c==='ո'){out+=start?(lang==='en'?'vo':'во'):(lang==='en'?'o':'о');continue;}
    if(c==='ե'){out+=start?(lang==='en'?'ye':'е'):(lang==='en'?'e':'е');continue;}
    out+=map[c]!==undefined?map[c]:c;
  }
  return out;
}
function allWords(){return BASE.concat(S.custom.map(c=>{const m=c.m||c.ru||'';
  return {id:c.id,hy:c.hy,ru:m,en:m,trRu:c.tr||translit(c.hy,'ru'),trEn:c.tr||translit(c.hy,'en'),th:MY,custom:true};}));}
const TR_=w=>S.lang==='en'?w.trEn:w.trRu;
const MEAN=w=>S.lang==='en'?w.en:w.ru;
function themesAll(){const ids=THEMES.map(x=>x.id);return S.custom.length?ids.concat(MY):ids;}
function st(id){return S.w[id]||(S.w[id]={f:{},lvl:0,next:0,err:0});}
function peek(id){return S.w[id]||{f:{},lvl:0,next:0,err:0};}
function status(w){const s=peek(w.id);if(s.lvl>0)return s.next<=Date.now()?'due':'learned';return FLAGS.some(f=>s.f[f])?'learning':'new';}
function knownSet(){return new Set(S.known);}
const isHand=sc=>(sc||S.script)==='hand';
const lkey=(l,sc)=>isHand(sc)?'h:'+l:l;
const knownList=sc=>isHand(sc)?S.hknown:S.known;
const gcls=sc=>isHand(sc)?'cur':'hy';
function missing(w,K){K=K||knownSet();return [...new Set(units(w.hy))].filter(u=>!K.has(u));}
function wordOK(w,K){return missing(w,K).length===0;}
function themed(){const th=S.themes;return allWords().filter(w=>!th.length||th.includes(w.th));}
function pool(){const K=knownSet();return themed().filter(w=>!S.onlyKnown||wordOK(w,K));}
function nextLetters(n){
  const K=knownSet(),cnt={};
  themed().forEach(w=>{const m=missing(w,K);if(m.length===1)cnt[m[0]]=(cnt[m[0]]||0)+1;});
  const unk=FREQ.filter(l=>!K.has(l));
  return unk.map(l=>({l,n:cnt[l]||0})).sort((a,b)=>b.n-a.n||FREQ.indexOf(a.l)-FREQ.indexOf(b.l)).slice(0,n);
}
function isDue(w){const s=peek(w.id);return s.lvl>0&&s.next<=Date.now();}
function due(){return allWords().filter(isDue).sort((a,b)=>peek(a.id).next-peek(b.id).next);}
function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function streak(){let n=0,d=new Date();if(!S.xp[today(d)])d.setDate(d.getDate()-1);while(S.xp[today(d)]){n++;d.setDate(d.getDate()-1);}return n;}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function units(s){const out=[];for(let i=0;i<s.length;i++){const c=s[i];if(c===' ')continue;if(c==='ո'&&s[i+1]==='ւ'){out.push('ու');i++;}else out.push(c);}return out;}

const TR=[{k:'brain',ico:'⚡'},{k:'wt',ico:'🇦🇲'},{k:'tw',ico:'🔎'},{k:'read',ico:'👁'},{k:'build',ico:'🧩'},{k:'write',ico:'✍️'},{k:'dict',ico:'🎧'},{k:'letters',ico:'Աա'},{k:'writing',ico:'🖊️'},{k:'review',ico:'🔁'}];
const trName=k=>L().tr[k][0], trDesc=k=>L().tr[k][1];
function learningOrder(list){
  return list.map((w,i)=>({w,i,n:FLAGS.filter(f=>peek(w.id).f[f]).length})).sort((a,b)=>b.n-a.n||a.i-b.i).map(x=>x.w);
}
function pickFor(flag,n){
  const p=pool();
  let c=learningOrder(p.filter(w=>peek(w.id).lvl===0&&!peek(w.id).f[flag])).slice(0,n);
  if(c.length<n){const rest=shuffle(p.filter(w=>!c.includes(w)&&(peek(w.id).lvl>0||FLAGS.some(f=>peek(w.id).f[f]))));c=c.concat(rest.slice(0,n-c.length));}
  return c;
}
function pickNew(n){return learningOrder(pool().filter(w=>peek(w.id).lvl===0)).slice(0,n);}
function pickPractice(n){
  const p=pool();let c=shuffle(p.filter(w=>status(w)!=='new')).slice(0,n);
  if(c.length<n)c=c.concat(p.filter(w=>status(w)==='new').slice(0,n-c.length));
  return shuffle(c);
}
function lettersOn(){return S.sel.length?ABC.filter(a=>S.sel.includes(a[0])):ABC;}
function available(k){
  const p=pool();
  if(k==='brain')return p.filter(w=>peek(w.id).lvl===0).length;
  if(FLAGS.includes(k))return p.filter(w=>peek(w.id).lvl===0&&!peek(w.id).f[k]).length;
  if(k==='review')return due().length;
  if(k==='letters'||k==='writing')return lettersOn().length;
  return p.length;
}
function options(w,fn,k){
  let all=allWords();
  if(S.onlyKnown){const K=knownSet(),ok=all.filter(x=>wordOK(x,K));if(ok.length>=k*2)all=ok;}
  const same=shuffle(all.filter(x=>x.th===w.th)),other=shuffle(all.filter(x=>x.th!==w.th));
  const seen=new Set([fn(w)]),out=[w];
  for(const x of same.concat(other)){if(out.length>=k)break;if(seen.has(fn(x)))continue;seen.add(fn(x));out.push(x);}
  return shuffle(out);
}
function letterOptions(a,k){
  const out=[a],seen=new Set([snd(a)]);
  for(const x of shuffle(ABC)){if(out.length>=k)break;if(seen.has(snd(x)))continue;seen.add(snd(x));out.push(x);}
  return shuffle(out);
}

let screen='home',ses=null,fb=null,dictQ='',dictF='all';

/* Daily lesson: review that is due + the letters that unlock the most words + a few new words */
function dailyPlan(){
  const rev=due().slice(0,8);
  const lets=nextLetters(3).map(x=>byL[x.l]).filter(Boolean);
  const nNew=lets.length?3:(rev.length?4:5);
  const fresh=pickNew(nNew);
  const tasks=rev.length*2+lets.length*3+fresh.length*(FLAGS.length+1);
  return {rev,lets,fresh,tasks,min:Math.max(1,Math.round(tasks*20/60))};
}
function dailyTasks(){
  const d=dailyPlan();let tasks=[];
  tasks=tasks.concat(shuffle(d.rev.map(w=>({t:rnd(['wt','tw','read']),w,rev:true}))));
  tasks=tasks.concat(shuffle(d.rev.map(w=>({t:rnd(['write','build']),w,rev:true}))));
  let seq=[];
  for(let r=0;r<3;r++){let sh=shuffle(d.lets);if(seq.length&&d.lets.length>1&&sh[0]===seq[seq.length-1])sh.push(sh.shift());seq=seq.concat(sh);}
  tasks=tasks.concat(seq.map(a=>({t:'L1',w:a,sc:S.script})));
  tasks=tasks.concat(d.fresh.map(w=>({t:'intro',w})));
  for(const f of FLAGS)tasks=tasks.concat(shuffle(d.fresh.map(w=>({t:f,w}))));
  return {tasks,rev:new Set(d.rev)};
}

function start(kind){
  let tasks=[];
  let rev=null;
  if(kind==='daily'){
    const d=dailyTasks();if(!d.tasks.length)return toast(t('dailyEmpty'));
    tasks=d.tasks;rev=d.rev;
  }else if(kind==='brain'){
    const ws=pickNew(5);if(!ws.length)return toast(t('noNew'));
    tasks=ws.map(w=>({t:'intro',w}));
    for(const f of FLAGS)tasks=tasks.concat(shuffle(ws.map(w=>({t:f,w}))));
  }else if(FLAGS.includes(kind)){
    const ws=pickFor(kind,10);if(!ws.length)return toast(t('noWords'));
    tasks=ws.map(w=>({t:kind,w}));
  }else if(kind==='dict'){
    const ws=pickPractice(10);if(!ws.length)return toast(t('noWords'));
    tasks=ws.map(w=>({t:'dict',w}));
  }else if(kind==='review'){
    const ws=due().slice(0,15);if(!ws.length)return toast(t('noReview'));
    tasks=shuffle(ws.map(w=>({t:rnd(['wt','tw','read']),w}))).concat(shuffle(ws.map(w=>({t:rnd(['write','build']),w}))));
  }else if(kind==='letters'){
    const Ls=lettersOn(),rounds=Math.min(3,Math.ceil(15/Ls.length));let seq=[];
    for(let r=0;r<rounds;r++){let sh=shuffle(Ls);if(seq.length&&Ls.length>1&&sh[0]===seq[seq.length-1])sh.push(sh.shift());seq=seq.concat(sh);}
    tasks=seq.slice(0,15).map(a=>({t:'L1',w:a,sc:S.script}));
  }else if(kind==='writing'){
    let picks;
    if(S.sel.length)picks=shuffle(lettersOn()).slice(0,8);
    else{const KL=new Set(knownList());const unk=FREQ.filter(l=>!KL.has(l));picks=(unk.length?unk.slice(0,5):shuffle(FREQ).slice(0,5)).map(l=>byL[l]);}
    const cs=()=>S.abcUp&&S.abcLo?rnd(['lo','lo','up']):(S.abcUp?'up':'lo');
    tasks=picks.map(a=>({t:'W',w:a,mode:'trace',cs:cs(),sc:S.script})).concat(shuffle(picks).map(a=>({t:'W',w:a,mode:'mem',cs:cs(),sc:S.script})));
  }
  ses={kind,tasks,i:0,done:0,total:tasks.length,res:new Map(),xp:0,hint:false,learned:[],newKnown:[],before:pool().length,sc:S.script,rev};
  fb=null;screen='session';render();
}
function cur(){return ses.tasks[ses.i];}
function prep(tk){
  if(tk.p&&tk.p.lang===S.lang)return tk.p;
  if(tk.p&&(tk.t==='build'||tk.t==='write'||tk.t==='dict'||tk.t==='W')){tk.p.lang=S.lang;return tk.p;}
  const w=tk.w,p={lang:S.lang};
  if(tk.t==='wt')p.opts=options(w,MEAN,5);
  if(tk.t==='tw')p.opts=options(w,x=>x.hy,5);
  if(tk.t==='read')p.opts=options(w,TR_,4);
  if(tk.t==='L1'||tk.t==='L2')p.opts=letterOptions(w,5);
  if(tk.t==='build'){
    p.units=units(w.hy);
    const K=knownSet(),cand=ABC.map(a=>a[0]).filter(u=>!p.units.includes(u));
    const pref=S.onlyKnown?cand.filter(u=>K.has(u)):cand;
    const extra=shuffle(pref).concat(shuffle(cand.filter(u=>!pref.includes(u)))).slice(0,p.units.length>8?2:3);
    p.tiles=shuffle(p.units.concat(extra)).map(u=>({u,used:false}));
    p.placed=[];p.mist=0;
  }
  if(tk.t==='write'||tk.t==='dict'){p.typed='';p.hints=0;}
  if(tk.t==='W'){p.strokes=[];p.revealed=false;}
  return tk.p=p;
}
function streakOf(l,sc){const k=lkey(l,sc);const h=(S.letters[k]&&S.letters[k].h)||[];let n=0;for(let i=h.length-1;i>=0&&h[i];i--)n++;return n;}
function resOf(w){if(!ses.res.has(w))ses.res.set(w,{w,ok:0,bad:0});return ses.res.get(w);}
function addXP(n){const d=today();S.xp[d]=(S.xp[d]||0)+n;ses.xp+=n;}
function setFlag(w,f,ok){
  const s=st(w.id);
  if(ok)s.f[f]=true;else{s.f[f]=false;s.err++;}
  if(s.lvl===0&&FLAGS.every(x=>s.f[x])){s.lvl=1;s.next=Date.now()+DAY;ses.learned.push(w);}
}
function answer(ok,extra){
  const tk=cur();
  const isWord=!/^[LW]/.test(tk.t);
  if(!tk.retry){
    {const r=resOf(tk.w);ok?r.ok++:r.bad++;}
    if(FLAGS.includes(tk.t)&&ses.kind!=='review'&&!tk.rev&&isWord)setFlag(tk.w,tk.t,ok);
  }
  if(!isWord&&!(tk.t==='W'&&tk.mode==='trace')){
    const l=tk.w[0],k=lkey(l,tk.sc),r=S.letters[k]||(S.letters[k]={ok:0,bad:0});ok?r.ok++:r.bad++;
    r.h=(r.h||[]).concat(ok?1:0).slice(-5);
    const KL=knownList(tk.sc);
    if(streakOf(l,tk.sc)>=3&&!KL.includes(l)){KL.push(l);ses.newKnown.push(l);toast(t('letterKnown',l));}
  }
  if(ok){ses.done++;addXP(XP[tk.t]||1);}
  else ses.tasks.push({t:tk.t,w:tk.w,retry:true,mode:tk.mode,cs:tk.cs,sc:tk.sc,rev:tk.rev});
  fb={ok,extra:extra||{}};
  save();render();
  if(isWord&&hyVoice)say(tk.w.hy);
  if(tk.t==='L1'&&ok){const at=ses.i;setTimeout(()=>{if(ses&&fb&&fb.ok&&ses.i===at&&screen==='session')next();},650);}
}
function next(){
  if(!ses)return;
  const tk=cur();
  if(tk&&tk.t==='intro'&&!fb){ses.done++;}
  fb=null;ses.hint=false;ses.i++;
  if(ses.i>=ses.tasks.length)finish();else{render();const n=cur();if(n.t==='intro'&&hyVoice)say(n.w.hy);}
}
function finish(){
  if(ses.kind==='review'||ses.kind==='daily'){
    for(const r of ses.res.values()){
      if(ses.kind==='daily'&&!ses.rev.has(r.w))continue;
      const s=st(r.w.id);
      s.lvl=r.bad?Math.max(1,s.lvl-1):Math.min(s.lvl+1,IV.length-1);
      s.next=Date.now()+IV[s.lvl]*DAY;
    }
  }
  if(ses.kind==='daily')S.dailyDone=today();
  save();screen='end';render();
}

function setupPad(tk){
  const pad=document.getElementById('wpad');if(!pad)return;
  const p=prep(tk),bg=document.getElementById('wbg'),fg=document.getElementById('wfg');
  const dpr=window.devicePixelRatio||1,W=pad.clientWidth,H=pad.clientHeight;
  [bg,fg].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);});
  const gl=tk.cs==='up'?tk.w[1]:tk.w[0],fam=isHand(tk.sc)?"'Arti'":"'Noto Sans Armenian',Arial,sans-serif";
  const css=getComputedStyle(document.documentElement),ink=css.getPropertyValue('--ink').trim()||'#222',line=css.getPropertyValue('--line').trim()||'#ddd',acc=css.getPropertyValue('--accent').trim()||'#E8833A';
  const drawBg=()=>{
    const c=bg.getContext('2d');c.clearRect(0,0,W,H);
    const fs=H*0.62;c.font=`${fs}px ${fam}`;
    const mX=c.measureText('ա'),mC=c.measureText('Ա'),mG=c.measureText(gl);
    const xh=mX.actualBoundingBoxAscent||fs*.45,cap=mC.actualBoundingBoxAscent||fs*.7;
    const asc=Math.max(mG.actualBoundingBoxAscent||cap,cap),desc=Math.max(mG.actualBoundingBoxDescent||0,fs*.22);
    const base=(H-(asc+desc))/2+asc;
    c.strokeStyle=line;c.lineWidth=1;
    [[base,0],[base-xh,1],[base-cap,1],[base+fs*.22,1]].forEach(([y,d])=>{c.setLineDash(d?[6,6]:[]);c.beginPath();c.moveTo(12,y);c.lineTo(W-12,y);c.stroke();});
    c.setLineDash([]);
    const x=(W-mG.width)/2;
    if(tk.mode==='trace'||p.revealed){c.globalAlpha=p.revealed?.55:.16;c.fillStyle=p.revealed?acc:ink;c.fillText(gl,x,base);c.globalAlpha=1;}
  };
  const drawFg=()=>{
    const c=fg.getContext('2d');c.clearRect(0,0,W,H);
    c.strokeStyle=ink;c.lineWidth=Math.max(5,H*.022);c.lineCap='round';c.lineJoin='round';
    for(const st of p.strokes){if(!st.length)continue;c.beginPath();c.moveTo(st[0][0]*W,st[0][1]*H);
      if(st.length===1)c.lineTo(st[0][0]*W+.1,st[0][1]*H);
      for(let i=1;i<st.length;i++){const a=st[i-1],b=st[i];c.quadraticCurveTo(a[0]*W,a[1]*H,(a[0]+b[0])/2*W,(a[1]+b[1])/2*H);}
      const l=st[st.length-1];c.lineTo(l[0]*W,l[1]*H);c.stroke();}
  };
  const go=()=>{drawBg();drawFg();};
  if(document.fonts&&document.fonts.load)document.fonts.load(`40px ${fam}`,gl).then(go,go);else go();
  go();
  if(fb||p.revealed)return;
  let cur=null;
  const pt=e=>{const r=fg.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];};
  fg.onpointerdown=e=>{e.preventDefault();try{fg.setPointerCapture(e.pointerId);}catch(_){}cur=[pt(e)];p.strokes.push(cur);drawFg();};
  fg.onpointermove=e=>{if(!cur)return;e.preventDefault();cur.push(pt(e));drawFg();};
  fg.onpointerup=fg.onpointercancel=()=>{cur=null;};
}

    const right=s.lvl>0?`<span class="badge ${stt==='due'?'due':''}">${stt==='due'?t('dueBadge'):t('lvl')+' '+s.lvl}</span>`:dots(s);
    const ms=S.onlyKnown?missing(w,K):[];
    return `<div class="wrow"><div class="grow"><div class="hy">${esc(w.hy)}</div><small>[${esc(TR_(w))}] — ${esc(MEAN(w))} · ${esc(themeName(w.th))}</small>${ms.length?`<div class="lock">${t('needs')} <span class="hy">${ms.map(esc).join(' ')}</span></div>`:''}</div>${right}
    ${hyVoice?`<button class="icon" onclick="A.say('${esc(w.hy)}')">🔊</button>`:''}
    <button class="icon" title="${esc(t('resetT'))}" onclick="A.reset('${esc(w.id)}')">↺</button>
    ${w.custom?`<button class="icon" title="${esc(t('delT'))}" onclick="A.del('${esc(w.id)}')">🗑</button>`:''}</div>`;}).join('')
    :`<p class="muted">${t('nothing')}</p>`;
}
function rLetSetup(){
  const sel=new Set(S.sel),K=new Set(knownList()),hand=isHand();
  const order=FREQ.map(l=>byL[l]);
  $app.innerHTML=`<div class="s-top"><button class="x" onclick="A.go('home')">✕</button><b style="flex:1;font-size:18px">Աա ${t('lsetT')}</b></div>
  <div class="seg" style="display:flex;margin-bottom:10px"><button style="flex:1;padding:10px" class="${hand?'':'on'}" onclick="A.script('print')">${t('scPrint')} <span class="hy">Աա</span></button><button style="flex:1;padding:10px" class="${hand?'on':''}" onclick="A.script('hand')">${t('scHand')} <span class="cur">Աա</span></button></div>
  <p class="muted" style="margin:0 0 10px">${t('lsetHint')}</p>
  <div class="abc-ctl"><b>${sel.size?t('lsetCount',sel.size):t('lsetNone')}</b></div>
  <div class="abc-ctl"><button class="chip" onclick="A.selNext()">${t('lsetNext')}</button>${sel.size?`<button class="chip" onclick="A.selNone()">${t('clearSel')}</button>`:''}</div>
  <div class="abc ${hand?'cur':''}">${order.map(a=>`<button class="${sel.has(a[0])?'sel':''} ${K.has(a[0])?'known':''}" onclick="A.abcT('${a[0]}')"><b>${esc(a[0])}</b><small>${esc(snd(a))}</small></button>`).join('')}</div>
  <button class="btn" style="width:100%;margin:14px 0 24px;position:sticky;bottom:12px" onclick="A.start('letters')">${sel.size?t('lsetStart',sel.size):t('lsetStartAll')}</button>`;
}
function rAbc(){
  const sel=new Set(S.sel),K=new Set(knownList()),hand=isHand();
  const order=S.abcSort==='freq'?FREQ.map(l=>byL[l]):ABC;
  const glyph=a=>(S.abcUp?esc(a[1]):'')+(S.abcLo?`<span class="lo">${esc(a[0])}</span>`:'');
  $app.innerHTML=`${topBar('Այբուբեն',t('abcSub'))}
  <div class="seg" style="display:flex;margin-bottom:12px"><button style="flex:1;padding:10px" class="${hand?'':'on'}" onclick="A.script('print')">${t('scPrint')} <span class="hy">Աա</span></button><button style="flex:1;padding:10px" class="${hand?'on':''}" onclick="A.script('hand')">${t('scHand')} <span class="cur">Աա</span></button></div>
  <p class="muted" style="margin-top:0">${hand?t('noteHand'):t('abcNote')}</p>
  <div class="abc-ctl">
    <div class="seg"><button class="${S.abcSort==='freq'?'on':''}" onclick="A.abcSet('abcSort','freq')">${t('sortFreq')}</button><button class="${S.abcSort!=='freq'?'on':''}" onclick="A.abcSet('abcSort','alpha')">${t('sortAlpha')}</button></div>
    <div class="seg"><button class="${S.abcUp?'on':''}" onclick="A.abcCase('abcUp')">${t('upper')}</button><button class="${S.abcLo?'on':''}" onclick="A.abcCase('abcLo')">${t('lower')}</button></div>
  </div>
  <div class="row-btns" style="margin:0 0 10px"><button class="btn" onclick="A.start('letters')">${sel.size?t('trainSel',sel.size):t('trainAll')}</button><button class="btn ghost" style="flex:0 0 auto;padding:14px 18px" onclick="A.start('writing')">${t('trainW')}</button></div>
  <div class="abc-ctl">
    <button class="chip" onclick="A.mark(true)">${t('markKnown')}</button>
    <button class="chip" onclick="A.mark(false)">${t('markForgot')}</button>
    ${sel.size?`<button class="chip" onclick="A.selNone()">${t('clearSel')}</button>`:''}
  </div>
  <div class="card" style="padding:12px 14px">${letterProgress(hand?'hand':'print')}${letterProgress(hand?'print':'hand',true)}</div>
  <div class="abc ${hand?'cur':''}">${order.map(a=>{const sk=Math.min(3,streakOf(a[0]));
    return `<button class="${sel.has(a[0])?'sel':''} ${K.has(a[0])?'known':''}" onclick="A.abcT('${a[0]}')"><b>${glyph(a)}</b><small>${esc(snd(a))}</small>
    <span class="sdots">${[0,1,2].map(i=>`<i class="${i<sk||K.has(a[0])?'on':''}"></i>`).join('')}</span></button>`;}).join('')}</div>
  <p class="muted">${t('legend')}${hand?'<br>'+t('fontCredit'):''}</p>
  ${navHtml()}`;
}

/* ================= ACTIONS ================= */
let armed=null;
function twice(k,msg){if(armed&&armed.k===k&&Date.now()-armed.t<4000){armed=null;return true;}armed={k,t:Date.now()};toast(msg);return false;}
function loadJSON(txt){const d=JSON.parse(txt);if(!d||typeof d.w!=='object')throw 0;S=Object.assign(defaults(),d,{lang:d.lang||S.lang});save();toast(t('loaded'));render();}
const A={
  go(s){screen=s;if(s!=='session')ses=null;fb=null;render();window.scrollTo(0,0);},
  start(k){start(k);window.scrollTo(0,0);},
  lang(){S.lang=S.lang==='en'?'ru':'en';save();render();},
  theme(th){if(!th)S.themes=[];else S.themes=S.themes.includes(th)?S.themes.filter(x=>x!==th):S.themes.concat(th);save();render();},
  quit(){ses=null;fb=null;screen='home';render();},
  next,say,
  hint(){ses.hint=true;render();},
  know(){const tk=cur();const s=st(tk.w.id);FLAGS.forEach(f=>s.f[f]=true);if(s.lvl===0){s.lvl=1;s.next=Date.now()+DAY;}
    ses.tasks=ses.tasks.filter((x,i)=>i<=ses.i||x.w!==tk.w);ses.total=ses.tasks.filter(x=>!x.retry).length;save();toast(t('marked'));next();},
  choose(i){if(fb)return;const tk=cur(),p=prep(tk);p.picked=i;answer(p.opts[i]===tk.w);},
  tile(i){
    if(fb)return;const p=prep(cur()),x=p.tiles[i];if(!x||x.used)return;
    const exp=p.units[p.placed.length];
    if(x.u===exp){x.used=true;p.placed.push(x.u);if(p.placed.length===p.units.length)return answer(p.mist===0);render();}
    else{p.mist++;x.bad=true;render();setTimeout(()=>{x.bad=false;if(screen==='session'&&!fb)render();},350);
      if(p.mist>=3){p.placed=p.units.slice();p.tiles.forEach(z=>z.used=true);answer(false);}}
  },
  key(ch){if(fb)return;const p=prep(cur());p.typed+=ch;render();},
  back(){if(fb)return;const p=prep(cur());p.typed=p.typed.endsWith('ու')?p.typed.slice(0,-2):p.typed.slice(0,-1);render();},
  letter(){
    if(fb)return;const tk=cur(),p=prep(tk),tgt=tk.w.hy;let i=0;
    while(i<p.typed.length&&i<tgt.length&&p.typed[i].toLowerCase()===tgt[i])i++;
    let n=i+1;if(tgt[i]==='ո'&&tgt[i+1]==='ւ')n++;if(tgt[i]===' ')n++;
    p.typed=tgt.slice(0,Math.min(n,tgt.length));p.hints++;
    if(norm(p.typed)===norm(tgt))return answer(false,{typed:''});
    render();
  },
  check(){const tk=cur(),p=prep(tk);if(fb||!p.typed.trim())return;answer(norm(p.typed)===norm(tk.w.hy)&&p.hints===0,{typed:p.typed});},
  giveup(){if(fb)return;answer(false,{typed:''});},
  q(v){dictQ=v;rList();},
  f(k){dictF=k;render();},
  add(){
    const hy=document.getElementById('f-hy').value.trim().toLowerCase(),m=document.getElementById('f-ru').value.trim(),tr=document.getElementById('f-tr').value.trim();
    if(!hy||!m)return toast(t('fillBoth'));
    if(!/^[Ա-և\s]+$/.test(hy))return toast(t('onlyHy'));
    if(allWords().some(w=>w.id===hy))return toast(t('exists'));
    S.custom.push({id:hy,hy,m,tr});save();toast(t('added'));render();
  },
  del(id){if(!twice('del'+id,t('delAgain')))return;S.custom=S.custom.filter(c=>c.id!==id);delete S.w[id];if(!S.custom.length)S.themes=S.themes.filter(x=>x!==MY);save();render();},
  reset(id){delete S.w[id];save();rList();toast(t('wordReset'));},
  resetAll(){if(!twice('reset',t('resetAgain')))return;S.w={};S.xp={};S.letters={};save();render();},
  goal(v){S.goal=Math.max(5,Math.min(500,parseInt(v)||30));save();},
  exp(){const txt=JSON.stringify(S);
    try{const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='armenian-words-progress-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}
    try{navigator.clipboard.writeText(txt).then(()=>toast(t('copied')),()=>toast(t('copyField')));}catch(e){toast(t('copyField'));}
    const ta=document.getElementById('io');if(ta)ta.value=txt;},
  imp(inp){const f=inp.files[0];if(!f)return;f.text().then(x=>{try{loadJSON(x);}catch(e){toast(t('readFail'));}});},
  impText(){try{loadJSON(document.getElementById('io').value);}catch(e){toast(t('readFail'));}},
  abcT(l){S.sel=S.sel.includes(l)?S.sel.filter(x=>x!==l):S.sel.concat(l);save();render();},
  selNone(){S.sel=[];save();render();},
  selNext(){const K=new Set(knownList());const add=FREQ.filter(l=>!K.has(l)&&!S.sel.includes(l)).slice(0,5);if(!add.length)return;S.sel=S.sel.concat(add);save();render();},
  abcSet(k,v){S[k]=v;save();render();},
  abcCase(k){S[k]=!S[k];if(!S.abcUp&&!S.abcLo)S[k==='abcUp'?'abcLo':'abcUp']=true;save();render();},
  mark(v){if(!S.sel.length)return toast(t('selectFirst'));
    const key=isHand()?'hknown':'known';
    if(v)S[key]=[...new Set(S[key].concat(S.sel))];
    else{S[key]=S[key].filter(l=>!S.sel.includes(l));S.sel.forEach(l=>{const k=lkey(l);if(S.letters[k])S.letters[k].h=[];});}
    S.sel=[];save();render();},
  only(v){S.onlyKnown=v;save();render();},
  script(v){S.script=v;save();render();},
  wclear(){const p=prep(cur());p.strokes=[];render();},
  wcheck(){const p=prep(cur());if(!p.strokes.length)return toast(t('drawFirst'));p.revealed=true;render();},
  wgrade(ok){if(fb)return;answer(ok);},
};

/* ================= KEYBOARD ================= */
window.addEventListener('keydown',e=>{
  if(screen!=='session'||!ses||e.ctrlKey||e.metaKey||e.altKey)return;
  if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  const tk=cur();if(!tk)return;
  if(e.key==='Tab'){e.preventDefault();if(!fb&&!ses.hint&&['wt','tw','build','write','dict'].includes(tk.t))A.hint();return;}
  if(fb||tk.t==='intro'){if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}return;}
  if(['wt','tw','read','L1','L2'].includes(tk.t)){const n=parseInt(e.key);if(n>=1&&n<=prep(tk).opts.length)A.choose(n-1);return;}
  if(tk.t==='build'){
    if(e.key.length!==1||e.key===' ')return;
    const k=e.key.toLowerCase();
    let cands;
    if(isHy(k)){if(k==='ւ')return;cands=k==='ո'?['ու','ո']:[k];}
    else{cands=PHON[k];if(!cands)return;}
    e.preventDefault();
    const p=prep(tk),exp=p.units[p.placed.length],free=x=>!x.used;
    let i=cands.includes(exp)?p.tiles.findIndex(x=>free(x)&&x.u===exp):-1;
    if(i<0)i=p.tiles.findIndex(x=>free(x)&&cands.includes(x.u));
    if(i<0)i=p.tiles.findIndex(x=>free(x)&&x.u!==exp);
    if(i>=0)A.tile(i);
    return;
  }
  if(tk.t==='write'||tk.t==='dict'){
    if(e.key==='Enter'&&e.shiftKey){e.preventDefault();A.giveup();return;}
    if(e.key==='Enter'){e.preventDefault();A.check();return;}
    if(e.key==='ArrowRight'){e.preventDefault();A.letter();return;}
    if(e.key==='Backspace'){e.preventDefault();A.back();return;}
    if(e.key===' '){e.preventDefault();A.key(' ');return;}
    if(e.key.length===1&&isHy(e.key.toLowerCase())){e.preventDefault();A.key(e.key.toLowerCase());}
  }
},true);
render();
</script>
