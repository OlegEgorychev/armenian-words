<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E8833A">
<title>Բառեր — армянские слова</title>
<style>
:root{
  --bg:#FBF7F2;--card:#FFFFFF;--ink:#2B2622;--muted:#7A6F66;--line:#ECE3D9;
  --accent:#E8833A;--accent-ink:#fff;--accent-soft:#FCEBDD;
  --ok:#3B9F5A;--ok-soft:#E3F4E8;--bad:#D2504A;--bad-soft:#FBE5E3;
  --hy:"Noto Sans Armenian","Arian AMU","Sylfaen","Mshtakan",system-ui,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1A1714;--card:#25211D;--ink:#F1EAE2;--muted:#A89C90;--line:#3A342E;
  --accent-soft:#3B2A1C;--ok-soft:#1E3326;--bad-soft:#3A2220;
}}
:root[data-theme=dark]{--bg:#1A1714;--card:#25211D;--ink:#F1EAE2;--muted:#A89C90;--line:#3A342E;--accent-soft:#3B2A1C;--ok-soft:#1E3326;--bad-soft:#3A2220}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hy{font-family:var(--hy)}
#app{max-width:580px;margin:0 auto;min-height:100vh;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.logo{font:700 26px var(--hy);letter-spacing:.5px}
.logo small{font:500 13px system-ui;color:var(--muted);margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:14px}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip em{font-style:normal;opacity:.7;margin-left:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;transition:transform .1s}
.tr-card:active{transform:scale(.98)}
.tr-card .ico{font-size:24px}
.tr-card b{font-size:16px}
.tr-card span{font-size:13px;color:var(--muted)}
.tr-card .cnt{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px}
.tr-card.wide{grid-column:span 2;background:linear-gradient(135deg,var(--accent),#D9622B);color:#fff;border:0}
.tr-card.wide span{color:#fff;opacity:.9}
.tr-card.wide .cnt{background:rgba(255,255,255,.25);color:#fff}
.tr-card.dim{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:190px;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--accent);font-weight:700}

/* session */
.s-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{border:0;background:none;font-size:24px;color:var(--muted);padding:4px 8px}
.s-top .bar{flex:1;height:14px}
.s-top .xp{font-weight:700;color:var(--accent);min-width:48px;text-align:right}
.q-label{color:var(--muted);font-size:14px;margin-bottom:8px;font-weight:600}
.prompt{text-align:center;padding:22px 8px 18px}
.prompt .big{font-size:40px;font-weight:600;line-height:1.2;word-break:break-word}
.prompt .big.hy{font-size:46px}
.prompt .sub{color:var(--muted);margin-top:6px;font-size:17px;min-height:24px}
.tools{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-size:18px;min-height:56px}
.opt .n{width:24px;height:24px;flex:none;border:1px solid var(--line);border-radius:6px;font-size:12px;display:grid;place-items:center;color:var(--muted)}
.opt .hy{font-size:24px}
.opt small{display:block;font-size:13px;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.letter{justify-content:center;font:600 34px var(--hy)}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin:6px 0 22px}
.slot-word{display:flex;gap:4px}
.slot{width:34px;height:46px;border-bottom:3px solid var(--line);display:grid;place-items:center;font:600 28px var(--hy)}
.slot.filled{border-color:var(--ok);color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{min-width:50px;height:54px;padding:0 10px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);font:600 28px var(--hy)}
.tile.used{visibility:hidden}
.tile.shake{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.typed{min-height:66px;border:2px solid var(--line);border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;font:600 34px var(--hy);padding:8px;margin-bottom:14px;word-break:break-all}
.typed .cur{display:inline-block;width:2px;height:34px;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.typed.ok{border-color:var(--ok);background:var(--ok-soft)}
.typed.bad{border-color:var(--bad);background:var(--bad-soft)}
.kb{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.key{border:1px solid var(--line);border-bottom-width:3px;background:var(--card);border-radius:9px;padding:6px 0 3px;font:600 21px var(--hy);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.key small{font:500 10px system-ui;color:var(--muted);margin-top:2px}
.key:active{background:var(--accent-soft)}
.key.wide{grid-column:span 4;font:600 15px system-ui}
.row-btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);border-bottom:4px solid rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
.btn:disabled{opacity:.45}
.intro{text-align:center}
.intro .big{font:600 52px var(--hy);margin:20px 0 4px}
.intro .tr{font-size:20px;color:var(--muted)}
.intro .ru{font-size:26px;font-weight:700;margin:18px 0 6px}
.intro .letters{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:18px}
.intro .letters span{border:1px solid var(--line);border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;min-width:42px}
.intro .letters b{font:600 24px var(--hy)}
.intro .letters small{color:var(--muted);font-size:12px}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:10;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:580px;margin:0 auto}
.fb.ok{background:var(--ok-soft);border-top:2px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-top:2px solid var(--bad)}
.fb h3{margin:0 0 6px;font-size:20px}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb .ans{margin-bottom:12px;font-size:16px}
.fb .ans .hy{font-size:24px;font-weight:600}
.fb .btn{width:100%}
.fb.ok .btn{background:var(--ok)}.fb.bad .btn{background:var(--bad)}
.diff b{color:var(--bad)}
.foot-space{height:190px}

/* end */
.end{text-align:center;padding-top:20px}
.end .big{font-size:64px}
.end h1{margin:8px 0}
.res{list-style:none;padding:0;margin:20px 0;text-align:left}
.res li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.res .hy{font-size:22px;font-weight:600}
.res .grow{flex:1}
.res small{color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.badge.due{background:var(--accent-soft);color:var(--accent)}

/* dictionary */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:10px}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.wrow .hy{font-size:22px;font-weight:600}
.wrow .grow{flex:1;min-width:0}
.wrow small{color:var(--muted)}
.icon{border:0;background:none;font-size:18px;padding:6px;color:var(--muted)}
.form{display:grid;gap:8px}
.form input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.form input.hy{font-size:20px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.muted{color:var(--muted);font-size:14px}

/* alphabet */
.abc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.abc button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center}
.abc button b{font:600 26px var(--hy)}
.abc button small{color:var(--muted);font-size:12px}
.abc button.on{border-color:var(--accent);background:var(--accent-soft)}
.abc .acc{font-size:10px;color:var(--ok)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= ДАННЫЕ ================= */
// формат: армянское | перевод | транскрипция ; строки "# Тема" начинают тему
const RAW = `

// Алфавит: [строчная, заглавная, звук]
const ABC = [
 ['ա','Ա','а'],['բ','Բ','б'],['գ','Գ','г'],['դ','Դ','д'],['ե','Ե','е / йе'],['զ','Զ','з'],['է','Է','э'],['ը','Ը','ы'],
 ['թ','Թ','т (придых.)'],['ժ','Ժ','ж'],['ի','Ի','и'],['լ','Լ','л'],['խ','Խ','х'],['ծ','Ծ','ц (твёрдое)'],['կ','Կ','к (твёрдое)'],['հ','Հ','h'],
 ['ձ','Ձ','дз'],['ղ','Ղ','гх'],['ճ','Ճ','ч (твёрдое)'],['մ','Մ','м'],['յ','Յ','й'],['ն','Ն','н'],['շ','Շ','ш'],['ո','Ո','о / во'],
 ['չ','Չ','ч (придых.)'],['պ','Պ','п (твёрдое)'],['ջ','Ջ','дж'],['ռ','Ռ','р (раскат.)'],['ս','Ս','с'],['վ','Վ','в'],['տ','Տ','т (твёрдое)'],['ր','Ր','р'],
 ['ց','Ց','ц (придых.)'],['ու','Ու','у'],['փ','Փ','п (придых.)'],['ք','Ք','к (придых.)'],['և','Եվ','ев'],['օ','Օ','о'],['ֆ','Ֆ','ф']
];
const SOUND = Object.fromEntries(ABC.map(a=>[a[0],a[2].split(' ')[0]]));
const baseSnd = s => s.split(' ')[0];

const BASE = [];
(function parse(){
  let th='';
  RAW.trim().split('\n').forEach(line=>{
    line=line.trim(); if(!line) return;
    if(line.startsWith('#')){th=line.slice(1).trim();return;}
    const [hy,ru,tr]=line.split('|').map(s=>s.trim());
    BASE.push({id:hy,hy,ru,tr,th});
  });
})();
const THEMES=[...new Set(BASE.map(w=>w.th))];

/* ================= СОСТОЯНИЕ ================= */
const KEY='hy-words-v1', DAY=864e5, IV=[0,1,3,7,14,30,60,120];
const FLAGS=['wt','tw','read','build','write'];
const XP={wt:1,tw:1,read:1,build:2,write:3,dict:3,L1:1,L2:1};
function defaults(){return{w:{},custom:[],xp:{},goal:30,themes:[],letters:{},lettersOn:null};}
let S=defaults();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(defaults(),s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function allWords(){return BASE.concat(S.custom.map(c=>({...c,th:'Мои слова',tr:c.tr||translit(c.hy),custom:true})));}
function themesAll(){return S.custom.length?THEMES.concat('Мои слова'):THEMES;}
function st(id){return S.w[id]||(S.w[id]={f:{},lvl:0,next:0,err:0});}
function peek(id){return S.w[id]||{f:{},lvl:0,next:0,err:0};}
function status(w){const s=peek(w.id);if(s.lvl>0)return s.next<=Date.now()?'due':'learned';return FLAGS.some(f=>s.f[f])?'learning':'new';}
function pool(){const t=S.themes;return allWords().filter(w=>!t.length||t.includes(w.th));}
function isDue(w){const s=peek(w.id);return s.lvl>0&&s.next<=Date.now();}
function due(){return allWords().filter(isDue).sort((a,b)=>peek(a.id).next-peek(b.id).next);}
function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function streak(){let n=0,d=new Date();if(!S.xp[today(d)])d.setDate(d.getDate()-1);while(S.xp[today(d)]){n++;d.setDate(d.getDate()-1);}return n;}

/* ================= УТИЛИТЫ ================= */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function units(s){const out=[];for(let i=0;i<s.length;i++){const c=s[i];if(c===' ')continue;if(c==='ո'&&s[i+1]==='ւ'){out.push('ու');i++;}else out.push(c);}return out;}
const norm=s=>s.toLowerCase().replace(/և/g,'եվ').replace(/\s+/g,' ').trim();
function translit(hy){
  let out='';const s=hy.toLowerCase();
  for(let i=0;i<s.length;i++){
    const c=s[i],start=i===0||s[i-1]===' ';
    if(c==='ո'&&s[i+1]==='ւ'){out+='у';i++;continue;}
    if(c==='ո'){out+=start?'во':'о';continue;}
    if(c==='ե'){out+=start?'е':'е';continue;}
    if(c==='և'){out+='ев';continue;}
    out+=SOUND[c]!==undefined?SOUND[c]:c;
  }
  return out;
}
const isHy=ch=>/^[Ա-և]$/.test(ch);

/* ================= ОЗВУЧКА ================= */
let hyVoice=null;
function initVoices(){try{hyVoice=speechSynthesis.getVoices().find(v=>/^hy/i.test(v.lang))||null;}catch(e){hyVoice=null;}}
if('speechSynthesis' in window){initVoices();try{speechSynthesis.onvoiceschanged=()=>{const had=!!hyVoice;initVoices();if(!had&&hyVoice)render();};}catch(e){}}
function say(t){if(!hyVoice)return;try{const u=new SpeechSynthesisUtterance(t);u.voice=hyVoice;u.lang=hyVoice.lang;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const spk=t=>hyVoice?`<button class="tool" onclick="A.say('${esc(t)}')">🔊 Слушать</button>`:'';

/* ================= ТРЕНИРОВКИ ================= */
const TR=[
 {k:'brain',ico:'⚡',name:'Брейншторм',desc:'5 новых слов через все упражнения подряд: знакомство, выбор, чтение, сборка, написание'},
 {k:'wt',ico:'🇦🇲',name:'Слово → перевод',desc:'Читаешь по-армянски, выбираешь перевод'},
 {k:'tw',ico:'🔎',name:'Перевод → слово',desc:'Ищешь армянское слово среди похожих'},
 {k:'read',ico:'👁',name:'Чтение',desc:'Как читается слово? Выбери транскрипцию'},
 {k:'build',ico:'🧩',name:'Конструктор',desc:'Собери слово из букв по порядку'},
 {k:'write',ico:'✍️',name:'Написание',desc:'Напиши слово на армянской клавиатуре'},
 {k:'dict',ico:'🎧',name:'Диктант',desc:'Пиши по транскрипции — тренирует орфографию'},
 {k:'letters',ico:'Աա',name:'Буквы',desc:'Буква ↔ звук. Выбери буквы во вкладке «Алфавит»'},
 {k:'review',ico:'🔁',name:'Повторение',desc:'Выученные слова по интервалам 1-3-7-14-30 дней'},
];
function learningOrder(list){
  return list.map((w,i)=>({w,i,n:FLAGS.filter(f=>peek(w.id).f[f]).length})).sort((a,b)=>b.n-a.n||a.i-b.i).map(x=>x.w);
}
function pickFor(flag,n){
  const p=pool();
  let c=learningOrder(p.filter(w=>peek(w.id).lvl===0&&!peek(w.id).f[flag])).slice(0,n);
  if(c.length<n){const rest=shuffle(p.filter(w=>!c.includes(w)&&(peek(w.id).lvl>0||FLAGS.some(f=>peek(w.id).f[f]))));c=c.concat(rest.slice(0,n-c.length));}
  return c;
}
function pickNew(n){return learningOrder(pool().filter(w=>peek(w.id).lvl===0)).slice(0,n);}
function pickPractice(n){
  const p=pool();let c=shuffle(p.filter(w=>status(w)!=='new')).slice(0,n);
  if(c.length<n)c=c.concat(p.filter(w=>status(w)==='new').slice(0,n-c.length));
  return shuffle(c);
}
function available(k){
  const p=pool();
  if(k==='brain')return p.filter(w=>peek(w.id).lvl===0).length;
  if(FLAGS.includes(k))return p.filter(w=>peek(w.id).lvl===0&&!peek(w.id).f[k]).length;
  if(k==='review')return due().length;
  if(k==='letters')return lettersOn().length;
  return p.length;
}
function lettersOn(){return S.lettersOn?ABC.filter(a=>S.lettersOn.includes(a[0])):ABC;}

function options(w,field,k){
  const all=allWords();
  const same=shuffle(all.filter(x=>x.th===w.th)), other=shuffle(all.filter(x=>x.th!==w.th));
  const seen=new Set([w[field]]),out=[w];
  for(const x of same.concat(other)){if(out.length>=k)break;if(seen.has(x[field]))continue;seen.add(x[field]);out.push(x);}
  return shuffle(out);
}
function letterOptions(a,k){
  const pool=shuffle(ABC.filter(x=>x[0]!==a[0]&&baseSnd(x[2])!==baseSnd(a[2])));
  const out=[a],seen=new Set([baseSnd(a[2])]);
  for(const x of pool){if(out.length>=k)break;if(seen.has(baseSnd(x[2])))continue;seen.add(baseSnd(x[2]));out.push(x);}
  return shuffle(out);
}

let screen='home',ses=null,fb=null,dictQ='',dictF='all';

function start(kind){
  let tasks=[];
  if(kind==='brain'){
    const ws=pickNew(5);if(!ws.length)return toast('В выбранных темах все слова уже выучены 🎉');
    tasks=ws.map(w=>({t:'intro',w}));
    for(const t of FLAGS)tasks=tasks.concat(shuffle(ws.map(w=>({t,w}))));
  }else if(FLAGS.includes(kind)){
    const ws=pickFor(kind,10);if(!ws.length)return toast('Нет слов в выбранных темах');
    tasks=ws.map(w=>({t:kind,w}));
  }else if(kind==='dict'){
    const ws=pickPractice(10);if(!ws.length)return toast('Нет слов в выбранных темах');
    tasks=ws.map(w=>({t:'dict',w}));
  }else if(kind==='review'){
    const ws=due().slice(0,15);if(!ws.length)return toast('Пока нечего повторять — выучи слова в тренировках');
    tasks=shuffle(ws.map(w=>({t:rnd(['wt','tw','read']),w}))).concat(shuffle(ws.map(w=>({t:rnd(['write','build']),w}))));
  }else if(kind==='letters'){
    const L=lettersOn();if(!L.length)return toast('Отметь буквы во вкладке «Алфавит»');
    const weight=a=>{const r=S.letters[a[0]]||{ok:0,bad:0};return Math.max(.4,1+r.bad*2-r.ok*.25);};
    for(let i=0;i<16;i++){
      let tot=L.reduce((s,a)=>s+weight(a),0),x=Math.random()*tot,pick=L[0];
      for(const a of L){x-=weight(a);if(x<=0){pick=a;break;}}
      if(L.length>1&&tasks.length&&tasks[tasks.length-1].w===pick){i--;continue;}
      tasks.push({t:rnd(['L1','L2']),w:pick});
    }
  }
  ses={kind,tasks,i:0,done:0,total:tasks.filter(t=>!t.retry).length,res:new Map(),xp:0,hint:false,learned:[]};
  fb=null;screen='session';render();
}
function cur(){return ses.tasks[ses.i];}
function prep(t){
  if(t.p)return t.p;
  const w=t.w,p={};
  if(t.t==='wt')p.opts=options(w,'ru',5);
  if(t.t==='tw')p.opts=options(w,'hy',5);
  if(t.t==='read')p.opts=options(w,'tr',4);
  if(t.t==='L1'||t.t==='L2')p.opts=letterOptions(w,4);
  if(t.t==='build'){
    p.units=units(w.hy);
    const extra=shuffle(ABC.map(a=>a[0]).filter(u=>!p.units.includes(u))).slice(0,p.units.length>8?2:3);
    p.tiles=shuffle(p.units.concat(extra)).map(u=>({u,used:false}));
    p.placed=[];p.mist=0;
  }
  if(t.t==='write'||t.t==='dict'){p.typed='';p.hints=0;}
  return t.p=p;
}
function resOf(w){if(!ses.res.has(w))ses.res.set(w,{w,ok:0,bad:0});return ses.res.get(w);}
function addXP(n){const d=today();S.xp[d]=(S.xp[d]||0)+n;ses.xp+=n;}
function setFlag(w,f,ok){
  const s=st(w.id);
  if(ok)s.f[f]=true;else{s.f[f]=false;s.err++;}
  if(s.lvl===0&&FLAGS.every(x=>s.f[x])){s.lvl=1;s.next=Date.now()+DAY;ses.learned.push(w);}
}
function answer(ok,extra){
  const t=cur();
  const isWord=!/^L/.test(t.t);
  if(!t.retry){
    if(isWord){const r=resOf(t.w);ok?r.ok++:r.bad++;}
    if(FLAGS.includes(t.t)&&ses.kind!=='review'&&isWord)setFlag(t.w,t.t,ok);
    if(!isWord){const r=S.letters[t.w[0]]||(S.letters[t.w[0]]={ok:0,bad:0});ok?r.ok++:r.bad++;}
    if(ses.kind==='review'&&!ok)resOf(t.w).bad=Math.max(1,resOf(t.w).bad);
  }else if(isWord&&!ok){resOf(t.w);}
  if(ok){ses.done++;addXP(XP[t.t]||1);}
  else ses.tasks.push({t:t.t,w:t.w,retry:true});
  fb={ok,extra:extra||{}};
  save();render();
  if(isWord&&hyVoice)say(t.w.hy);
}
function next(){
  if(!ses)return;
  const t=cur();
  if(t&&t.t==='intro'&&!fb){ses.done++;}
  fb=null;ses.hint=false;ses.i++;
  if(ses.i>=ses.tasks.length)finish();else{render();const n=cur();if(n.t==='intro'&&hyVoice)say(n.w.hy);}
}
function finish(){
  if(ses.kind==='review'){
    for(const r of ses.res.values()){
      const s=st(r.w.id);
      s.lvl=r.bad?Math.max(1,s.lvl-1):Math.min(s.lvl+1,IV.length-1);
      s.next=Date.now()+IV[s.lvl]*DAY;r.lvl=s.lvl;
    }
  }
  save();screen='end';render();
}

/* ================= ОТРИСОВКА ================= */
const $app=document.getElementById('app');
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}

}

    <div class="stats">
      <div><b>${cnt.new}</b><span>новые</span></div>

    </div>
  </div>
  <h2>Темы</h2>

    <button class="chip ${S.themes.length?'':'on'}" onclick="A.theme('')">Все<em>${all.length}</em></button>
    ${themesAll().map(th=>`<button class="chip ${S.themes.includes(th)?'on':''}" onclick="A.theme('${esc(th)}')">${esc(th)}<em>${tc(th)}</em></button>`).join('')}
  </div>
  <h2>Тренировки</h2>
  <div class="grid">
    ${TR.map((t,i)=>{const n=available(t.k);return `<button class="tr-card ${i===0?'wide':''} ${n?'':'dim'}" onclick="A.start('${t.k}')">
      <span class="cnt">${t.k==='letters'?n+' букв':n}</span><div class="ico">${t.ico}</div><b>${t.name}</b><span>${t.desc}</span></button>`;}).join('')}
  </div>
  <p class="muted" style="margin-top:16px">Слово считается выученным, когда пройдено во всех пяти тренировках (Слово→перевод, Перевод→слово, Чтение, Конструктор, Написание). Потом оно уходит в «Повторение».</p>

function sessionTop(){
  return `<div class="s-top"><button class="x" onclick="A.quit()">✕</button><div class="bar"><i style="width:${ses.done/ses.total*100}%"></i></div><div class="xp">+${ses.xp}</div></div>`;
}
const hyText=(w,size)=>`<span class="hy">${esc(w.hy)}</span>`;
function hintBtn(label){return ses.hint||fb?'':`<button class="tool" onclick="A.hint()">💡 ${label||'Транскрипция'}</button>`;}

  else if(t.t==='read'){
    body=`<div class="q-label">Как читается это слово?</div>
    <div class="prompt"><div class="big hy">${esc(w.hy)}</div><div class="sub">${fb?esc(w.ru):''}</div></div>

  }
  else if(t.t==='L1'){
    body=`<div class="q-label">Какой это звук?</div>

  }
  else if(t.t==='L2'){

    <div class="slots">${parts.map(part=>`<div class="slot-word">${part.map(()=>{const u=p.placed[k++];return `<div class="slot ${u?'filled':''}">${u?esc(u):''}</div>`;}).join('')}</div>`).join('')}</div>
    <div class="tiles">${p.tiles.map((x,i)=>`<button class="tile ${x.used?'used':''} ${x.bad?'shake':''}" onclick="A.tile(${i})">${esc(x.u)}</button>`).join('')}</div>

  }
  else if(t.t==='write'||t.t==='dict'){

  }
  $app.innerHTML=sessionTop()+body+(fb?'<div class="foot-space"></div>':'');
  if(fb)document.body.insertAdjacentHTML('beforeend',feedback(t));
}
function choices(opts,label,target,letter,cls){
  const p=prep(cur());
  return `<div class="opts ${letter?'two':''}">${opts.map((o,i)=>{
    let c='';if(fb){if(o===target)c='ok';else if(p.picked===i)c='bad';}
    return `<button class="opt ${cls||''} ${c}" onclick="A.choose(${i})">${cls?'':`<span class="n">${i+1}</span>`}${label(o)}</button>`;}).join('')}</div>`;
}
function keyboard(){
  return `<div class="kb">${ABC.map(a=>`<button class="key" onclick="A.key('${a[0]}')">${a[0]}<small>${esc(baseSnd(a[2]))}</small></button>`).join('')}
  <button class="key wide" onclick="A.key(' ')">пробел</button><button class="key wide" onclick="A.back()">⌫ стереть</button></div>`;
}
function feedback(t){
  const w=t.w,ok=fb.ok;let ans='';
  if(/^L/.test(t.t)){ans=`<span class="hy">${esc(w[1])} ${esc(w[0])}</span> — ${esc(w[2])}`;}
  else{
    ans=`<span class="hy">${esc(w.hy)}</span> [${esc(w.tr)}] — ${esc(w.ru)}`;

  }
  const praise=rnd(['Отлично!','Верно!','Так держать!','Супер!','Правильно!']);
  const learned=ses.learned.length&&ses.learned[ses.learned.length-1]===w&&ok&&!t.retry?' 🎓 Слово выучено!':'';
  return `<div class="fb ${ok?'ok':'bad'}"><div class="in"><h3>${ok?praise+learned:'Неправильно'}</h3><div class="ans">${ans}</div>
  <div class="row-btns" style="margin:0">${!/^L/.test(t.t)&&hyVoice?`<button class="btn ghost" style="flex:0 0 64px" onclick="A.say('${esc(w.hy)}')">🔊</button>`:''}<button class="btn" onclick="A.next()">Дальше ⏎</button></div></div></div>`;
}
function diff(a,b){
  const A=[...norm(a)],B=[...norm(b)];
  return A.map((c,i)=>c===B[i]?esc(c):`<b>${esc(c)}</b>`).join('');
}
function rEnd(){
  const r=[...ses.res.values()];
  const good=r.filter(x=>!x.bad).length;
  const lettersMode=ses.kind==='letters';
  $app.innerHTML=`<div class="end">
    <div class="big">${lettersMode||good>=r.length*.7?'🎉':'💪'}</div>
    <h1>Тренировка завершена</h1>
    <p class="muted">+${ses.xp} XP · сегодня ${S.xp[today()]||0} / ${S.goal}${ses.learned.length?` · выучено слов: ${ses.learned.length}`:''}</p>
    ${lettersMode?'':`<ul class="res">${r.map(x=>{const s=peek(x.w.id);
      return `<li><span>${x.bad?'❌':'✅'}</span><div class="grow"><div class="hy">${esc(x.w.hy)}</div><small>[${esc(x.w.tr)}] — ${esc(x.w.ru)}</small></div>
      ${s.lvl>0?`<span class="badge">ур. ${s.lvl}</span>`:dots(s)}</li>`;}).join('')}</ul>`}
    <div class="row-btns"><button class="btn ghost" onclick="A.go('home')">На главную</button><button class="btn" onclick="A.start('${ses.kind}')">Ещё раз</button></div>
  </div>`;
}
function dots(s){return `<span class="dots" title="${FLAGS.map(f=>FLAG_N[f]+(s.f[f]?' ✓':'')).join(', ')}">${FLAGS.map(f=>`<i class="${s.f[f]?'on':''}"></i>`).join('')}</span>`;}
const FLAG_N={wt:'Слово→перевод',tw:'Перевод→слово',read:'Чтение',build:'Конструктор',write:'Написание'};

function rDict(){
  $app.innerHTML=`
  <div class="top"><div class="logo">Բառարան<small>словарь</small></div></div>
  <details class="card"><summary>➕ Добавить своё слово</summary>
    <div class="form" style="margin-top:12px">
      <input id="f-hy" class="hy" placeholder="Армянское слово (напр. ծիծաղ)" lang="hy">
      <input id="f-ru" placeholder="Перевод">
      <input id="f-tr" placeholder="Транскрипция (необязательно)">
      <button class="btn" onclick="A.add()">Добавить</button>
    </div></details>
  <input class="search" placeholder="Поиск по-армянски, по-русски или транскрипции" value="${esc(dictQ)}" oninput="A.q(this.value)">
  <div class="chips" style="margin-bottom:8px">${[['all','Все'],['new','Новые'],['learning','Изучаю'],['learned','Выучено'],['due','Повторить']].map(([k,n])=>`<button class="chip ${dictF===k?'on':''}" onclick="A.f('${k}')">${n}</button>`).join('')}</div>
  <div id="dlist"></div>
  <details class="card" style="margin-top:20px"><summary>⚙️ Настройки и прогресс</summary>
    <div class="form" style="margin-top:12px">
      <label class="muted">Цель XP в день <input type="number" min="5" max="500" value="${S.goal}" onchange="A.goal(this.value)" style="width:90px;margin-left:8px"></label>
      <button class="btn ghost" onclick="A.exp()">⬇️ Экспорт прогресса</button>
      <label class="btn ghost" style="text-align:center">⬆️ Импорт из файла<input type="file" accept=".json" style="display:none" onchange="A.imp(this)"></label>
      <textarea id="io" rows="3" placeholder="Сюда попадёт JSON при экспорте. Чтобы импортировать — вставь JSON и нажми кнопку ниже" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:12px monospace"></textarea>
      <button class="btn ghost" onclick="A.impText()">Импорт из текста</button>
      <button class="btn ghost" style="color:var(--bad)" onclick="A.resetAll()">Сбросить весь прогресс</button>
      <p class="muted">Прогресс хранится в этом браузере. ${hyVoice?'Армянский голос найден 🔊':'Армянский голос для озвучки на этом устройстве не найден — озвучка скрыта.'}</p>
    </div></details>
  ${navHtml()}`;
  rList();
}
function rList(){
  const q=dictQ.toLowerCase().trim();
  const list=allWords().filter(w=>(dictF==='all'||status(w)===dictF||(dictF==='learned'&&status(w)==='due'))&&(!q||w.hy.includes(q)||w.ru.toLowerCase().includes(q)||w.tr.toLowerCase().includes(q)));
  const el=document.getElementById('dlist');if(!el)return;
  el.innerHTML=list.length?list.map(w=>{const s=peek(w.id),stt=status(w);
    const right=s.lvl>0?`<span class="badge ${stt==='due'?'due':''}">${stt==='due'?'повторить':'ур. '+s.lvl}</span>`:dots(s);
    return `<div class="wrow"><div class="grow"><div class="hy">${esc(w.hy)}</div><small>[${esc(w.tr)}] — ${esc(w.ru)} · ${esc(w.th)}</small></div>${right}
    ${hyVoice?`<button class="icon" onclick="A.say('${esc(w.hy)}')">🔊</button>`:''}
    <button class="icon" title="Сбросить прогресс слова" onclick="A.reset('${esc(w.id)}')">↺</button>
    ${w.custom?`<button class="icon" title="Удалить" onclick="A.del('${esc(w.id)}')">🗑</button>`:''}</div>`;}).join('')
    :'<p class="muted">Ничего не найдено</p>';
}
function rAbc(){
  const on=new Set(lettersOn().map(a=>a[0]));
  $app.innerHTML=`<div class="top"><div class="logo">Այբուբեն<small>алфавит</small></div></div>
  <p class="muted">Отметь буквы, которые хочешь тренировать в упражнении «Буквы». Под буквой — звук и процент правильных ответов.</p>
  <div class="chips" style="margin-bottom:12px"><button class="chip" onclick="A.abcAll(true)">Выбрать все</button><button class="chip" onclick="A.abcAll(false)">Снять все</button><button class="chip on" onclick="A.start('letters')">▶ Тренировать</button></div>
  <div class="abc">${ABC.map(a=>{const r=S.letters[a[0]];const pc=r&&(r.ok+r.bad)?Math.round(r.ok/(r.ok+r.bad)*100)+'%':'';
    return `<button class="${on.has(a[0])?'on':''}" onclick="A.abcT('${a[0]}')"><b>${a[1]}${a[0].length>1?'':' '+a[0]}</b><small>${esc(a[2])}</small><span class="acc">${pc}</span></button>`;}).join('')}</div>
  ${navHtml()}`;
}

/* ================= ДЕЙСТВИЯ ================= */
const A={
  go(s){screen=s;ses=s==='session'?ses:null;fb=null;render();window.scrollTo(0,0);},
  start(k){start(k);window.scrollTo(0,0);},
  theme(th){if(!th)S.themes=[];else S.themes=S.themes.includes(th)?S.themes.filter(x=>x!==th):S.themes.concat(th);save();render();},
  quit(){ses=null;fb=null;screen='home';render();},
  next,
  say,
  hint(){ses.hint=true;render();},
  know(){const t=cur();const s=st(t.w.id);FLAGS.forEach(f=>s.f[f]=true);if(s.lvl===0){s.lvl=1;s.next=Date.now()+DAY;}
    ses.tasks=ses.tasks.filter((x,i)=>i<=ses.i||x.w!==t.w);ses.total=ses.tasks.filter(x=>!x.retry).length;save();toast('Слово отмечено как выученное');next();},
  choose(i){if(fb)return;const t=cur(),p=prep(t);p.picked=i;answer(p.opts[i]===t.w);},
  tile(i){
    if(fb)return;const p=prep(cur()),x=p.tiles[i];if(x.used)return;
    const exp=p.units[p.placed.length];
    if(x.u===exp){x.used=true;p.placed.push(x.u);if(p.placed.length===p.units.length)return answer(p.mist===0);render();}
    else{p.mist++;x.bad=true;render();setTimeout(()=>{x.bad=false;if(screen==='session'&&!fb)render();},350);
      if(p.mist>=3){p.placed=p.units.slice();p.tiles.forEach(t=>t.used=true);answer(false);}}
  },
  key(ch){if(fb)return;const p=prep(cur());p.typed+=ch;render();},
  back(){if(fb)return;const p=prep(cur());p.typed=p.typed.endsWith('ու')?p.typed.slice(0,-2):p.typed.slice(0,-1);render();},
  letter(){
    const t=cur(),p=prep(t),tgt=t.w.hy;let i=0;
    while(i<p.typed.length&&i<tgt.length&&p.typed[i].toLowerCase()===tgt[i])i++;
    let n=i+1;if(tgt[i]==='ո'&&tgt[i+1]==='ւ')n++;if(tgt[i]===' ')n++;
    p.typed=tgt.slice(0,Math.min(n,tgt.length));p.hints++;
    if(norm(p.typed)===norm(tgt))return answer(false,{typed:''});
    render();
  },
  check(){const t=cur(),p=prep(t);if(fb||!p.typed.trim())return;const ok=norm(p.typed)===norm(t.w.hy);answer(ok&&p.hints===0,{typed:p.typed});},
  giveup(){if(fb)return;answer(false,{typed:''});},
  q(v){dictQ=v;rList();},
  f(k){dictF=k;render();},
  add(){
    const hy=document.getElementById('f-hy').value.trim().toLowerCase(),ru=document.getElementById('f-ru').value.trim(),tr=document.getElementById('f-tr').value.trim();
    if(!hy||!ru)return toast('Заполни армянское слово и перевод');
    if(!/^[Ա-և\s]+$/.test(hy))return toast('В армянском поле должны быть только армянские буквы');
    if(allWords().some(w=>w.id===hy))return toast('Такое слово уже есть');
    S.custom.push({id:hy,hy,ru,tr});save();toast('Добавлено в тему «Мои слова»');render();
  },
  del(id){if(!twice('del'+id,'Нажми 🗑 ещё раз, чтобы удалить'))return;S.custom=S.custom.filter(c=>c.id!==id);delete S.w[id];S.themes=S.themes.filter(t=>t!=='Мои слова'||S.custom.length);save();render();},
  reset(id){delete S.w[id];save();rList();toast('Прогресс слова сброшен');},
  resetAll(){if(!twice('reset','Нажми ещё раз, чтобы сбросить весь прогресс (свои слова останутся)'))return;S.w={};S.xp={};S.letters={};save();render();},
  goal(v){S.goal=Math.max(5,Math.min(500,parseInt(v)||30));save();},
  exp(){const txt=JSON.stringify(S);
    try{const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='armenian-words-progress-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}
    try{navigator.clipboard.writeText(txt).then(()=>toast('Прогресс скопирован в буфер обмена (и скачан, если браузер разрешает)'),()=>toast('Скопируй текст из поля ниже'));}catch(e){}
    const ta=document.getElementById('io');if(ta)ta.value=txt;},
  impText(){const ta=document.getElementById('io');try{const d=JSON.parse(ta.value);if(!d||typeof d.w!=='object')throw 0;S=Object.assign(defaults(),d);save();toast('Прогресс загружен');render();}catch(e){toast('Не получилось прочитать текст');}},
  imp(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d||typeof d.w!=='object')throw 0;S=Object.assign(defaults(),d);save();toast('Прогресс загружен');render();}catch(e){toast('Не получилось прочитать файл');}});},
  abcT(l){const on=new Set(lettersOn().map(a=>a[0]));on.has(l)?on.delete(l):on.add(l);S.lettersOn=[...on];save();render();},
  abcAll(v){S.lettersOn=v?null:[];save();render();},
};
let armed=null;function twice(k,msg){if(armed&&armed.k===k&&Date.now()-armed.t<4000){armed=null;return true;}armed={k,t:Date.now()};toast(msg);return false;}

/* ================= КЛАВИАТУРА ================= */
document.addEventListener('keydown',e=>{
  if(screen!=='session'||!ses||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=cur();if(!t)return;
  if(fb||t.t==='intro'){if(e.key==='Enter'||e.key===' '){e.preventDefault();next();}return;}
  if(['wt','tw','read','L1','L2'].includes(t.t)){const n=parseInt(e.key);if(n>=1&&n<=prep(t).opts.length){A.choose(n-1);}return;}
  if(t.t==='build'){
    const k=e.key.toLowerCase();if(!isHy(k)||k==='ւ')return;
    const p=prep(t),exp=p.units[p.placed.length];
    let i=p.tiles.findIndex(x=>!x.used&&x.u===k);
    if(k==='ո'&&exp==='ու'){i=p.tiles.findIndex(x=>!x.used&&x.u==='ու');}
    if(i<0)i=p.tiles.findIndex(x=>!x.used&&x.u.startsWith(k));
    if(i<0)i=p.tiles.findIndex(x=>!x.used&&x.u!==exp);
    if(i>=0)A.tile(i);
    return;
  }
  if(t.t==='write'||t.t==='dict'){
    if(e.key==='Enter'){e.preventDefault();A.check();return;}
    if(e.key==='Backspace'){e.preventDefault();A.back();return;}
    if(e.key===' '){e.preventDefault();A.key(' ');return;}
    if(e.key.length===1&&isHy(e.key.toLowerCase())){e.preventDefault();A.key(e.key.toLowerCase());}
  }
});
render();
</script>
</body>
